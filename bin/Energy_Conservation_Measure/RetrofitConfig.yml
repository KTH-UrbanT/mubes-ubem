#This files provides the Energy Conservation Measures settings
0_SIM:
  ECM:
      ECM_to_Implement: ['Envelop', 'HVAC']
  RetCase:
    BuildID: [1c931069-d3d1-4559-8968-e7f0564579fbex]

ECM_Category:
  Envelope:
    Window:
      UFactor: 3                     #[Float]v
      Solar_Heat_Gain_Coefficient: 0.7   #[Float]
      Visible_Transmittance: 0.8         #[Float]
  #****************************************************************************************
    Wall Inertia:
      Thickness: 0.2567                     #[Float] #this layer will be considered also for the basement walls
      Conductivity: 0.9                  #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 2300                      #[Float]
      Specific_Heat: 1000                #[Float]
    Wall Insulation:
      Thickness: 0.2                     #[Float]
      Conductivity: 0.034554                 #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 150                       #[Float]
      Specific_Heat: 1000                #[Float]
      #'Thermal_Absorptance' : 0.001
  #****************************************************************************************
    Basement Floor:
      Thickness: 0.1                     #[Float] #this layer will be considered also for the basement floor
      Conductivity: 0.9                  #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 2300                      #[Float]
      Specific_Heat: 1000                #[Float]

    #   Basement Floor Insulation :
    #       Thickness : 0.05    #not needed as even without basement the Heated1rstFloor is taken for the first floor
    #       Conductivity : 0.25*0.1
    #       Roughness : "Rough"
    #       Density : 1000
    #       Specific_Heat : 1000
    #   Roof Inertia :
    #        Thickness : 0.05 #not needed unless one wants to have inertia in the roof layer
    #        Conductivity : 0.15*0.1
    #        Roughness : "Rough"
    #        Density : 1000
    #        Specific_Heat : 1000
  #****************************************************************************************
    Roof Insulation:
      Thickness: 0.34                     #[Float]
      Conductivity: 0.03                 #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 150                       #[Float]
      Specific_Heat: 1000                #[Float]
      #Thermal_Absorptance : 0.001
  #****************************************************************************************
    Heated1rstFloor Inertia:
      Thickness: 0.1                     #[Float]
      Conductivity: 0.9                  #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 2300                      #[Float]
      Specific_Heat: 1000                #[Float]
    Heated1rstFloor Insulation:
      Thickness: 0.15                    #[Float]
      Conductivity: 0.035                #[Float]
      Roughness: "Rough"                 #[Str]
      Density: 150                       #[Float]
      Specific_Heat: 1000                #[Float]
      #Thermal_Absorptance : 0.001
#**********************************************************************************************************************************************************
#******************************** Ventilation *************************************************************************************************************
#**********************************************************************************************************************************************************
  HVACSystem:
    SysType:  'HVAC'                # s


