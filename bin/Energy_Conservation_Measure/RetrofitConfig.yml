Occupancy_Schedule:
  name: "Occupancy_Schedule"     # Name of the schedule
  building:
    office_open: "08:00"         # Opening time of the office
    office_close: "18:00"        # Closing time of the office
  setpoint: 1.0                  # Setpoint during office hours (e.g., occupancy level)


Compact_Schedule_OccupActivity:
  name: "Compact_Schedule_OccupActivity"               # Name of the compact schedule
  schedule_type_limits_name: "Any Number" # Schedule type limits
  field_1: "Through: 12/31"              # Time period
  field_2: "For: AllDays"                # Day type
  field_3: 'Until: 24:00'                # Time until
  field_4: 55                           # Setpoint value

